revision_history:
  type: pandas.CSVDataset
  filepath: data/0_source/00_extract_vintagedata.csv
  load_args:
    decimal: ","

vintage_data:
  type: pandas.ParquetDataset
  filepath: data/01_raw/vintage_data.parquet

ds_spec:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/variable.csv

harmonized_data:
  type: pandas.ExcelDataset
  filepath: data/02_intermediate/harmonized_time_series.xlsx
  load_args:
    engine: openpyxl
    sheet_name: data
    header: 
    index_col: 
  save_args:
    sheet_name: data
    index: True

aligned_transformed_data:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/transformed_data.parquet
    
aligned_non_transformed_data:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/non_transformed_data.parquet